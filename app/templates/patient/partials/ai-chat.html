<div
        class="ai-chat-widget"
        id="aiChatWidget">

    <button
            aria-label="Mở AI Assistant"
            class="ai-chat-toggle"
            id="aiChatToggle"
            type="button">

        <i class="bi bi-robot"></i>

    </button>


    <div
            class="ai-chat-box d-none"
            id="aiChatBox">

        <div class="ai-chat-header">

            <div
                    class="d-flex align-items-center gap-2">

                <div class="ai-chat-avatar">

                    <i class="bi bi-robot"></i>

                </div>

                <div>

                    <div class="fw-semibold">
                        AI Assistant
                    </div>

                    <div class="ai-chat-online">
                        ● Đang hoạt động
                    </div>

                </div>

            </div>


            <button
                    class="btn btn-sm text-white border-0"
                    id="aiChatClose"
                    type="button">

                <i class="bi bi-x-lg"></i>

            </button>

        </div>


        <div
                class="ai-chat-messages"
                id="aiChatMessages">

            <div class="ai-message">

                <div class="ai-message-avatar">
                    <i class="bi bi-robot"></i>
                </div>

                <div class="ai-message-content">

                    Xin chào! Tôi là AI Assistant.
                    Tôi có thể hỗ trợ bạn tìm bác sĩ,
                    xem lịch và đặt lịch khám.

                </div>

            </div>

        </div>


        <form
                class="ai-chat-input-area"
                id="aiChatForm">

            <input
                    autocomplete="off"
                    class="form-control"
                    id="aiChatInput"
                    maxlength="2000"
                    placeholder="Nhập tin nhắn..."
                    type="text">

            <button
                    class="btn btn-primary"
                    id="aiChatSend"
                    type="submit">

                <i class="bi bi-send-fill"></i>

            </button>

        </form>

    </div>

</div>
